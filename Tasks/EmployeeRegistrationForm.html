<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Employee Registration Form</title>
    <link rel="icon" href="./formicon.jpg">
</head>

<body>
    <fieldset style="height:650px; width:500px; text-align: center; margin:50px auto;">
        <h3>
            <center>Job Application</center>
        </h3>
            <label>First Name:</label>
            <input type="text" required placeholder="Ex: Shalini">
            <br>
            <br>
            <label>Last Name:</label>
            <input type="text" placeholder="Ex: E" required>
            <br>
            <br>
            <label>E-Mail:</label>
            <input type="mail" placeholder="Ex: example@example.com" required>
            <br>
            <br>
            <label>Phone Number:</label>
            <input type="tel" placeholder="(+91) 7894561023" required>
            <br>
            <br>
            <label>Date of Birth:</label>
            <input type="date" required>
            <br>
            <br>
            <label>Gender:</label>
            <input type="radio" name="gender">
            <label>Male</label>
            <input type="radio" name="gender">
            <label>Female</label>
            <br>
            <br>
            <label>Passed Out:</label>
            <select>
                <option>Select</option>
                <option>2026</option>
                <option>2025</option>
                <option>2024</option>
            </select>
            <br>
            <br>
            <label>Applied Position:</label>
            <select>
                <option>Select</option>
                <option>Full Stack Developer</option>
                <option>Front End Developer</option>
                <option>Data Analyst</option>
                <option>Java Developer </option>
            </select>
            <br>
            <br>
            <label>Preferred Test Date:</label>
            <input type="datetime-local">
            <br>
            <br>
            <label>Cover Letter:</label>
            <textarea cols="30" rows="5"></textarea>
            <br>
            <br>
            <label>Resume:</label>
            <input type="file">
            <br>
            <br>
            <label>Any Other Documents to Upload:</label>
            <input type="file" multiple accept=".pdf,.jpg,.docx">
            <br>
            <br>
            <button type="submit">Submit</button>
    </fieldset>
</body>

</html>
