<html>

<head>
    <title>Day 4 HTML Session</title>
</head>

<body>
    <form autocomplete="on">
        <label>Enter the User Name</label>
        <input type="text" placeholder="Enter the User Name" required>
        <br><br>
        <label>Enter the Email</label>
        <input type="email" placeholder="Enter the Email" required>
        <br><br>
        <label>Enter the Password</label>
        <input type="password" placeholder="Enter the Password" required maxlength="10" minlength="5">
        <br><br>
        <label>Resume File</label>
        <input type="file" multiple accept=".pdf, .jpg">
        <br><br>
        <label>Date and Time</label>
        <input type="date">
        <input type="datetime">
        <input type="datetime-local">
        <br><br>
        <label>Gender</label>
        <input type="radio" value="Male" name="gender" checked> Male
        <input type="radio" Value="Female" name="gender">Female
        <br><br>
        <label>Skills</label>
        <input type="checkbox" value="HTML" name="skills" checked>HTML
        <input type="checkbox" value="CSS" name="skills" checked>CSS
        <input type="checkbox" value="BS" name="skills">BS
        <input type="checkbox" value="JS" name="skills">JS
        <input type="checkbox" value="RJS" name="skills">RJS
        <br><br>
        <label>Job Role</label>
        <select>
            <option selected>Please Select the Job Role</option>
            <option>Front End - React JS</option>
            <option>Front End - Angular JS</option>
            <option>Front End - VUE JS</option>
            <option>Back End - Node JS</option>
            <option>Back End - Spring Boot</option>
            <option>Back End - Django</option>
        </select>

        <br><br>

        <select multiple>
            <option>Front End - React JS</option>
            <option>Front End - Angular JS</option>
            <option>Front End - VUE JS</option>
            <option>Back End - Node JS</option>
            <option>Back End - Spring Boot</option>
            <option>Back End - Django</option>
        </select>

        <br><br>

        <input list="data">
        <datalist id="data">
            <option>JavaScript</option>
            <option>Java</option>
            <option>Python </option>
            <option>React JS</option>
            <option>React Native</option>

        </datalist>

        <br><br>
        <textarea rows="10" cols="30"></textarea>

        <br><br>

        <input type="color">
        <input type="search">
        <input type="number" step="2">


        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>

    <hr>

    <fieldset>
        <legend align="center">Student Details</legend>
        <label>Enter the User Name</label>
        <input type="text" placeholder="Enter the User Name" required>
        <br><br>

        <br><br>

        <input type="password" placeholder="Enter the Password" required maxlength="10" minlength="5">

        <label>Resume File</label>
        <input type="file" multiple accept=".pdf, .jpg">
        <br><br>
        <label>Date and Time</label>
        <input type="date">
        <input type="datetime">
        <input type="datetime-local">
        <br><br>
        <label>Gender</label>
        <input type="radio" value="Male" name="gender" checked> Male
        <input type="radio" Value="Female" name="gender">Female
        <br><br>
        <label>Skills</label>
        <input type="checkbox" value="HTML" name="skills" checked>HTML
        <input type="checkbox" value="CSS" name="skills" checked>CSS
        <input type="checkbox" value="BS" name="skills">BS
        <input type="checkbox" value="JS" name="skills">JS
        <input type="checkbox" value="RJS" name="skills">RJS
        <br><br>
        <label>Job Role</label>
        <select>
            <option selected>Please Select the Job Role</option>
            <option>Front End - React JS</option>
            <option>Front End - Angular JS</option>
            <option>Front End - VUE JS</option>
            <option>Back End - Node JS</option>
            <option>Back End - Spring Boot</option>
            <option>Back End - Django</option>
        </select>

        <br><br>

        <select multiple>
            <option>Front End - React JS</option>
            <option>Front End - Angular JS</option>
            <option>Front End - VUE JS</option>
            <option>Back End - Node JS</option>
            <option>Back End - Spring Boot</option>
            <option>Back End - Django</option>
        </select>


        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </fieldset>
</body>

</html>
