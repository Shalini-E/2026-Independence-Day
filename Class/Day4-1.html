<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day4-1</title>
</head>

<body>
    <br>
    <h1>
        <center>Sign Up:</center>
    </h1>
    <form style="text-align:center;">
        <label>First Name :</label>
        <input type="text" placeholder="EX: SHALINI" required>
        <br>
        <br>
        <label>Last name :</label>
        <input type="text" placeholder="EX: E" required>
        <br>
        <br>
         <label>Date of Birth :</label>
        <input type="date">
         <br>
         <br>
        <label>E-Mail :</label>
        <input type="email" placeholder="EX: abc@gmail.com" required>
        <br>
        <br>
        <label>Mobile No :</label>
        <input type="tel" maxlength="12" placeholder="Ex: +911236054789" required>
        <br>
        <br>
        <label>Gender :</label>
        <input type="radio" name="gender">
        <label>Male</label>
       <input type="radio" name="gender">
       <label>Female</label>
       <br>
       <br>
       <label>Address :</label>
       <br>
    <textarea id="address" name="address" rows="4" cols="40" placeholder="address"></textarea>
       <br>
       <br>
        <label for="state">State :</label>
        <select id="state" name="state">
            <option value="">--Select State--</option>
            <option>Tamil Nadu</option>
            <option>Kerala</option>
            <option>Karnataka</option>
        </select>
        <br>
        <br>
        <label>Skills :</label>
        <input type="checkbox">
        <label>HTML</label>
        <input type="checkbox">
        <label>CSS</label>
        <input type="checkbox">
        <label>Power BI</label>
        <input type="checkbox">
        <label>SQL</label>

    </form>
</body>

</html>
